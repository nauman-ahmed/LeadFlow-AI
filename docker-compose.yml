services:
  n8n:
    image: n8nio/n8n:latest
    container_name: smart-travel-n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n:/home/node/.n8n
      - ./data:/data
      - ./:/project
    environment:
      - N8N_SECURE_COOKIE=false
      - TZ=Europe/Berlin
      - NODES_EXCLUDE="[]"
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
    restart: unless-stopped